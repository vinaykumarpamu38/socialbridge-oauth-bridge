<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Returning to SocialBridge…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #F5F3FC;
    color: #1B1B23;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  .box { max-width: 320px; padding: 24px; }
  a.button {
    display: inline-block;
    margin-top: 16px;
    padding: 12px 24px;
    background: #4C3BCF;
    color: #fff;
    border-radius: 24px;
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="box">
    <p>Finishing sign-in…</p>
    <a class="button" id="returnLink" href="#">Return to the app</a>
  </div>

<script>
  function hasOAuthParams(str) {
    return /[?#&](code|access_token|error)=/.test(str);
  }

  var hash = window.location.hash || "";
  var search = window.location.search || "";

  var suffix;
  if (hasOAuthParams(search)) {
    suffix = search;
  } else if (hasOAuthParams(hash)) {
    suffix = hash;
  } else {
    suffix = search || hash;
  }

  var appUrl = "socialbridge://oauth" + suffix;

  var link = document.getElementById("returnLink");
  link.href = appUrl;

  window.location.replace(appUrl);
</script>
</body>
</html>
